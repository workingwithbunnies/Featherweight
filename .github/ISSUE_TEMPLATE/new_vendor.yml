name: Describe an app / support my PC's apps
description: Help Featherweight describe a background app it found on your PC (e.g. ASUS Armoury Crate, MSI Center, Lenovo Vantage). No coding needed.
title: "[Describe] "
labels: ["catalog"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Featherweight already **finds** background software from any brand. This request helps it
        **describe** an app: what it's for, what you'd lose without it, and when to keep it.
        Descriptions are written and checked by the project ([how they work](../blob/main/docs/KNOWLEDGE.md)).

        **Privacy:** this page is public. Share only what's below; there's no need to attach a full diagnostics report.

  - type: textarea
    id: details
    attributes:
      label: The app's details from Featherweight
      description: |
        In Featherweight, open **Optimize**, select the app, click **Copy for a report**, and paste here.
        It contains only that app's names and facts (your user name and PC name are removed). Please read it before posting.
      render: text
    validations:
      required: true

  - type: textarea
    id: features
    attributes:
      label: What does the app do that people might still want?
      description: |
        E.g. fan control, keyboard lighting, battery charge limits, hotkeys. If you tried switching it off, what stopped
        working (and did Restore default bring it back)? This decides whether it's suggested as Optional or Keep.
    validations:
      required: true

  - type: input
    id: pc-model
    attributes:
      label: PC maker and model (optional)
      placeholder: "ASUS ROG Strix G16 (2024)"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read what I pasted and I'm happy for it to be public.
          required: true
