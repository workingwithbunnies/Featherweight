# Builds Featherweight on GitHub's Windows servers for every push and pull request,
# so a broken build is caught immediately. The exe is kept for 14 days under the run's "Artifacts".
name: Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Featherweight-${{ github.sha }}
          path: artifacts/Featherweight.exe
          retention-days: 14
